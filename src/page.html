<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producer</title>
<meta name="description" content="A private screen for a live host.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0722">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5733b'/%3E%3Cpath d='M8 24V9l8 7 8-7v15' fill='none' stroke='%232a120a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/*@CSS@*/</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="brand__mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V6l8 6 8-6v12"/></svg></span>Producer <small>· no show loaded yet</small></div>
  <button type="button" class="chip private" data-tip="Only you see this window. Never share it on stream."><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><path d="m4 4 16 16"/></svg><span class="long">Private</span></button>
</header>

<main class="screen" id="screen">
  <section class="setup" aria-labelledby="setupTitle">
    <div class="setup__col">
      <h1 id="setupTitle">Set up <span class="chip" id="browserChip"></span></h1>
      <ol class="steps" role="list">
        <li class="step" id="sStream" data-done>
          <span class="step__n" aria-hidden="true">1</span><span class="step__label" id="streamLabel">I stream with</span>
          <div class="step__ctl"><div class="seg" id="streamSeg" role="group" aria-labelledby="streamLabel">
            <button type="button" data-v="restream" aria-pressed="true">Restream Studio</button>
            <button type="button" data-v="wave" aria-pressed="false">Wave.video</button>
            <button type="button" data-v="obs" aria-pressed="false">OBS</button>
            <button type="button" data-v="other" aria-pressed="false">Other</button>
          </div></div>
        </li>
      </ol>
    </div>
  </section>
</main>

<div class="tip" id="tip" role="tooltip"></div>

<script>/*@APP@*/</script>
</body>
</html>
